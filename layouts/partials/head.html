{{ partial "meta" . }}
<script src="https://kit.fontawesome.com/bc56c2b7b7.js" crossorigin="anonymous"></script>
<script>
    // On page load or when changing themes, best to add inline in `head` to avoid FOUC
    if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    } else {
        document.documentElement.classList.remove('dark')
    }
</script>

{{ $styles := resources.Get "css/style.css" | postCSS }}
{{ $dlstyles := resources.Get "css/dlstyle.scss" | toCSS }}
{{ $splide := resources.Get "css/splide-sea-green.css"}}

{{ $CSS := slice $styles $dlstyles $splide | resources.Concat "main.css" }}
<link rel="stylesheet" href="{{ $CSS.RelPermalink }}" media="all">
