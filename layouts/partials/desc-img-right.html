<div class="{{ .context.color }} overflow-hidden">
    <div class="overflow-hidden sm:pt-6 lg:relative">
        <div class="max-w-md px-4 mx-auto sm:max-w-3xl sm:px-6 pb-8 lg:grid lg:max-w-7xl lg:grid-cols-2 lg:gap-12 lg:px-8">
            <div class="md:mt-8 glass">
                <div class="p-8 sm:max-w-xl">
                    <h1 class="text-4xl font-bold tracking-tight text-gray-900 dark:text-white sm:text-5xl">
                        {{ .context.baseTitle }}
                    </h1>
                    <div class="mt-6 space-y-6 text-gray-900 dark:text-white">
                        {{ range .info }}
                        <p class="text-2xl leading-7 font-bold">{{ .title }}</p>
                        <p class="text-lg leading-7">
                            {{ .desc }}
                        </p>
                        {{ end }}
                    </div>
                </div>
            </div>
        </div>

        <div class="sm:mx-auto sm:max-w-3xl sm:px-6">
            <div class="sm:relative my-8 lg:absolute lg:inset-y-0 lg:right-0 lg:w-1/2">
                <div class="hidden sm:block">
                    <svg class="absolute -mr-3 top-8 right-1/2 lg:left-0 lg:m-0" width="404" height="392" fill="none"
                         viewBox="0 0 404 392" loading="lazy">
                        <defs>
                            <pattern id="837c3e70-6c3a-44e6-8854-cc48c737b659" x="0" y="0" width="20" height="20"
                                     patternUnits="userSpaceOnUse">
                                <rect x="0" y="0" width="4" height="4" class="text-gray-200 dark:text-gray-900/60"
                                      fill="currentColor" />
                            </pattern>
                        </defs>
                        <rect width="404" height="392" fill="url(#837c3e70-6c3a-44e6-8854-cc48c737b659)" />
                    </svg>
                </div>
                <div class="relative pl-4 -mr-40 sm:content-none  sm:mx-auto sm:max-w-fit sm:px-0 lg:h-full lg:max-w-none lg:pl-12 box-border">
                    <img src="{{ .context.image }}" class="w-full rounded-lg lg:h-full lg:w-auto lg:max-w-none" loading="lazy"/>
                </div>
            </div>
        </div>
    </div>
