pipelines:
  default:
    - step:
        name: Sync GitHub Mirror
        image: alpine/git:latest
        clone:
          enabled: false
        script:
          - git clone --bare git@bitbucket.org:giftshower/blissweb.git
          - cd blissweb.git
          - git push --mirror git@github.com:GiftShower/blissweb.git